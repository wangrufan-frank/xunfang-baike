<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480" role="img" aria-labelledby="title-extinguisher-structure">
  <title id="title-extinguisher-structure">手提贮压式干粉灭火器结构标注示意图</title>
  <defs>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a93226"/><stop offset="0.4" stop-color="#c0392b"/>
      <stop offset="0.7" stop-color="#d9534f"/><stop offset="1" stop-color="#a93226"/>
    </linearGradient>
    <linearGradient id="neckGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7f241b"/><stop offset="0.5" stop-color="#c0392b"/><stop offset="1" stop-color="#7f241b"/>
    </linearGradient>
  </defs>

  <!-- 画布底卡 -->
  <rect width="800" height="480" rx="12" fill="#EAF2F8" stroke="#D8E2EC"/>

  <!-- 筒体 -->
  <rect x="325" y="150" width="150" height="230" rx="14" fill="url(#bodyGrad)" stroke="#7f241b" stroke-width="2"/>
  <!-- 颈部 -->
  <path d="M357 150 L350 116 H450 L443 150 Z" fill="url(#neckGrad)" stroke="#7f241b" stroke-width="2"/>
  <!-- 筒底弧线 -->
  <ellipse cx="400" cy="380" rx="75" ry="14" fill="#7f241b" opacity="0.35"/>

  <!-- 提把 + 压把 -->
  <rect x="370" y="72" width="60" height="16" rx="8" fill="#243447" stroke="#16222e" stroke-width="2"/>
  <rect x="392" y="88" width="16" height="28" fill="#40566B" stroke="#16222e" stroke-width="1"/>
  <path d="M366 102 H434 L428 116 H372 Z" fill="#40566B" stroke="#16222e" stroke-width="1.5"/>

  <!-- 保险销（铅封）：琥珀色安全环 -->
  <circle cx="436" cy="100" r="10" fill="none" stroke="#D98B2B" stroke-width="4"/>
  <line x1="444" y1="100" x2="464" y2="100" stroke="#D98B2B" stroke-width="4" stroke-linecap="round"/>

  <!-- 压力表：白盘 + 绿安全区 + 红危险区 + 指针 -->
  <circle cx="400" cy="205" r="34" fill="#FFFCF7" stroke="#1F4E79" stroke-width="3"/>
  <path d="M381 192 A24 24 0 0 1 419 192" stroke="#27ae60" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M381 218 A24 24 0 0 1 419 218" stroke="#c0392b" stroke-width="6" fill="none" stroke-linecap="round"/>
  <line x1="400" y1="205" x2="408" y2="193" stroke="#243447" stroke-width="3" stroke-linecap="round"/>
  <circle cx="400" cy="205" r="3" fill="#243447"/>

  <!-- 喷管（软管 + 喷嘴） -->
  <path d="M475 268 Q560 262 566 316 Q570 360 516 366" fill="none" stroke="#2c3e50" stroke-width="15" stroke-linecap="round"/>
  <path d="M516 366 L500 374 L505 352 L530 352 Z" fill="#40566B" stroke="#16222e" stroke-width="1.5"/>

  <!-- 铭牌 -->
  <rect x="348" y="252" width="104" height="58" rx="6" fill="#FFFCF7" opacity="0.92" stroke="#D8E2EC"/>
  <text x="400" y="280" text-anchor="middle" font-size="17" font-weight="700" fill="#243447" font-family="system-ui,'Microsoft YaHei',sans-serif">ABC干粉</text>
  <text x="400" y="299" text-anchor="middle" font-size="12" fill="#60758C" font-family="system-ui,'Microsoft YaHei',sans-serif">手提贮压式灭火器</text>

  <!-- 标注引线（警蓝） -->
  <g stroke="#1F4E79" stroke-width="2" fill="none">
    <line x1="238" y1="88"  x2="368" y2="88"/><circle cx="368" cy="88" r="3" fill="#1F4E79"/>
    <line x1="600" y1="100" x2="444" y2="100"/><circle cx="444" cy="100" r="3" fill="#1F4E79"/>
    <line x1="238" y1="200" x2="368" y2="203"/><circle cx="368" cy="203" r="3" fill="#1F4E79"/>
    <line x1="238" y1="337" x2="323" y2="337"/><circle cx="323" cy="337" r="3" fill="#1F4E79"/>
    <line x1="600" y1="347" x2="556" y2="345"/><circle cx="556" cy="345" r="3" fill="#1F4E79"/>
  </g>

  <!-- 标注文字框（白底 + 警蓝） -->
  <g font-family="system-ui,'Microsoft YaHei',sans-serif">
    <g><rect x="80" y="70" width="156" height="36" rx="6" fill="#FFFFFF" stroke="#1F4E79"/>
        <text x="158" y="94" text-anchor="middle" font-size="19" font-weight="700" fill="#1F4E79">提把压把</text></g>
    <g><rect x="602" y="70" width="150" height="36" rx="6" fill="#FFFFFF" stroke="#1F4E79"/>
        <text x="677" y="94" text-anchor="middle" font-size="19" font-weight="700" fill="#1F4E79">保险销</text></g>
    <g><rect x="80" y="182" width="156" height="36" rx="6" fill="#FFFFFF" stroke="#1F4E79"/>
        <text x="158" y="206" text-anchor="middle" font-size="19" font-weight="700" fill="#1F4E79">压力表</text></g>
    <g><rect x="80" y="319" width="156" height="36" rx="6" fill="#FFFFFF" stroke="#1F4E79"/>
        <text x="158" y="343" text-anchor="middle" font-size="19" font-weight="700" fill="#1F4E79">筒体</text></g>
    <g><rect x="602" y="329" width="150" height="36" rx="6" fill="#FFFFFF" stroke="#1F4E79"/>
        <text x="677" y="353" text-anchor="middle" font-size="19" font-weight="700" fill="#1F4E79">喷管</text></g>
  </g>
</svg>
