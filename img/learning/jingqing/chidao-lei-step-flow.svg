<svg xmlns="http&#58;//www.w3.org/2000/svg" viewBox="0 0 760 600" role="img" aria-labelledby="title desc">
  <title id="title">持刀类警情隔离防护与分支处置图</title>
  <desc id="desc">图中显示群众区、防护线和持刀者区域，强调先疏散、建立盾牌防护、统一沟通；放下刀具时转入控制搜身和救助，出现即时攻击时依法采取必要措施并在危险消除后立即停止。</desc>
  <defs><style>.light{fill:#fff}.dark{fill:#18354c}.card{fill:#fff;stroke:#b8cedd;stroke-width:2}.line{fill:none;stroke:#2c6e9e;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.desktop{display:block}.mobile{display:none}@media (max-width:500px){.desktop{display:none}.mobile{display:block}}</style></defs>
  <rect width="760" height="600" rx="24" fill="#f4f8fb"/>
  <g class="desktop">
    <rect x="24" y="22" width="712" height="66" rx="14" fill="#163f60"/><text x="48" y="64" class="light" font-family="Microsoft YaHei, sans-serif" font-size="28" font-weight="700">持刀警情｜先隔离防护，再统一处置</text>
    <g transform="translate(34 112)">
      <rect width="692" height="236" rx="18" class="card"/>
      <text x="24" y="35" class="dark" font-family="Microsoft YaHei, sans-serif" font-size="19" font-weight="700">现场关系：群众区 ← 疏散通道 ｜ 防护线 ｜ 危险区域</text>
      <g transform="translate(44 70)"><circle cx="30" cy="26" r="18" fill="#efc5a4" stroke="#18354c" stroke-width="3"/><path d="M10 53q20-15 40 0v64H10z" fill="#6a8da5" stroke="#18354c" stroke-width="3"/><circle cx="78" cy="30" r="16" fill="#efc5a4" stroke="#18354c" stroke-width="3"/><path d="M60 55q18-14 36 0v58H60z" fill="#8eb4c9" stroke="#18354c" stroke-width="3"/><path d="M120 66h72" class="line"/><path d="M120 66l20-13v26z" fill="#2c6e9e"/></g>
      <path d="M285 62v142" stroke="#bf4a45" stroke-width="6" stroke-dasharray="14 10"/>
      <g transform="translate(324 66)"><path d="M20 8h86v124q-43 30-86 0z" fill="#2c6e9e" stroke="#18354c" stroke-width="3"/><circle cx="136" cy="29" r="19" fill="#efc5a4" stroke="#18354c" stroke-width="3"/><path d="M112 57q24-18 48 0v76h-48z" fill="#315d79" stroke="#18354c" stroke-width="3"/><text x="2" y="170" class="dark" font-family="Microsoft YaHei, sans-serif" font-size="17">盾牌防护 · 保持距离</text></g>
      <g transform="translate(558 70)"><circle cx="34" cy="25" r="19" fill="#efc5a4" stroke="#18354c" stroke-width="3"/><path d="M10 54q24-19 48 0v72H10z" fill="#d98b2b" stroke="#18354c" stroke-width="3"/><path d="M52 68l43-28" stroke="#18354c" stroke-width="5"/><path d="M93 38l20-7-12 18z" fill="#aeb9c1" stroke="#18354c" stroke-width="2"/><text x="-8" y="170" class="dark" font-family="Microsoft YaHei, sans-serif" font-size="17">持刀者区域</text></g>
    </g>
    <rect x="34" y="370" width="214" height="112" rx="14" fill="#e2f1ec"/><text x="54" y="405" class="dark" font-family="Microsoft YaHei, sans-serif" font-size="20" font-weight="700">放下刀具 / 威胁解除</text><text x="54" y="437" class="dark" font-family="Microsoft YaHei, sans-serif" font-size="17">控制、搜身、收缴</text><text x="54" y="464" class="dark" font-family="Microsoft YaHei, sans-serif" font-size="17">检查伤情并固定证据</text>
    <rect x="273" y="370" width="214" height="112" rx="14" fill="#fff0d9"/><text x="293" y="405" class="dark" font-family="Microsoft YaHei, sans-serif" font-size="20" font-weight="700">持续对峙</text><text x="293" y="437" class="dark" font-family="Microsoft YaHei, sans-serif" font-size="17">稳定沟通、请求增援</text><text x="293" y="464" class="dark" font-family="Microsoft YaHei, sans-serif" font-size="17">不降低战术戒备</text>
    <rect x="512" y="370" width="214" height="112" rx="14" fill="#f8e3df"/><text x="532" y="405" class="dark" font-family="Microsoft YaHei, sans-serif" font-size="20" font-weight="700">即时攻击 / 生命危险</text><text x="532" y="437" class="dark" font-family="Microsoft YaHei, sans-serif" font-size="17">依法采取必要措施</text><text x="532" y="464" class="dark" font-family="Microsoft YaHei, sans-serif" font-size="17">危险消除立即停止</text>
    <rect x="34" y="510" width="692" height="64" rx="14" fill="#163f60"/><text x="58" y="550" class="light" font-family="Microsoft YaHei, sans-serif" font-size="19" font-weight="700">三条线并行：疏散群众｜盾牌防护｜单一口径沟通；全程记录并为 120 留通道</text>
  </g>
  <g class="mobile">
    <rect width="760" height="600" rx="24" fill="#f4f8fb"/><rect x="24" y="20" width="712" height="64" rx="14" fill="#163f60"/><text x="48" y="62" class="light" font-family="Microsoft YaHei, sans-serif" font-size="30" font-weight="700">持刀警情｜分支处置</text>
    <rect x="30" y="106" width="700" height="92" rx="16" class="card"/><text x="54" y="145" class="dark" font-family="Microsoft YaHei, sans-serif" font-size="28" font-weight="700">1 疏散群众，建立防护线</text><text x="54" y="179" class="dark" font-family="Microsoft YaHei, sans-serif" font-size="25">盾牌在前，保持距离，统一口径沟通</text>
    <rect x="30" y="214" width="700" height="92" rx="16" fill="#e2f1ec"/><text x="54" y="253" class="dark" font-family="Microsoft YaHei, sans-serif" font-size="28" font-weight="700">2 放下刀具 → 控制搜身救助</text><text x="54" y="287" class="dark" font-family="Microsoft YaHei, sans-serif" font-size="25">收缴刀具、检查伤情、固定证据</text>
    <rect x="30" y="322" width="700" height="92" rx="16" fill="#fff0d9"/><text x="54" y="361" class="dark" font-family="Microsoft YaHei, sans-serif" font-size="28" font-weight="700">3 持续对峙 → 沟通并增援</text><text x="54" y="395" class="dark" font-family="Microsoft YaHei, sans-serif" font-size="25">沟通是手段，不降低战术戒备</text>
    <rect x="30" y="430" width="700" height="92" rx="16" fill="#f8e3df"/><text x="54" y="469" class="dark" font-family="Microsoft YaHei, sans-serif" font-size="28" font-weight="700">4 即时危险 → 依法必要处置</text><text x="54" y="503" class="dark" font-family="Microsoft YaHei, sans-serif" font-size="25">危险消除立即停止，转入救助和记录</text>
    <text x="54" y="560" class="dark" font-family="Microsoft YaHei, sans-serif" font-size="25" font-weight="700">禁止：单人冒进、无防护接近、危险解除后继续用力</text>
  </g>
</svg>
