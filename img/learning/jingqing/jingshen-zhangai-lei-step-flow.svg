<svg xmlns="http&#58;//www.w3.org/2000/svg" viewBox="0 0 760 600" role="img" aria-labelledby="title desc">
  <title id="title">疑似精神障碍警情行为观察与保护分流图</title>
  <desc id="desc">图示要求仅按可观察行为和环境风险判断，不作医学诊断；先减少刺激、建立缓冲和简短沟通，再根据是否存在即时危险分流至保护性控制或家属医疗协同。</desc>
  <defs><style>.light{fill:#fff}.dark{fill:#18354c}.card{fill:#fff;stroke:#b8cedd;stroke-width:2}.line{fill:none;stroke:#2c6e9e;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.desktop{display:block}.mobile{display:none}@media (max-width:500px){.desktop{display:none}.mobile{display:block}}</style></defs>
  <rect width="760" height="600" rx="24" fill="#f5f9fb"/>
  <g class="desktop">
    <rect x="24" y="22" width="712" height="66" rx="14" fill="#315d79"/><text x="48" y="64" class="light" font-family="Microsoft YaHei, sans-serif" font-size="28" font-weight="700">疑似精神障碍警情｜看行为，不贴标签</text>
    <rect x="34" y="112" width="210" height="238" rx="16" class="card"/><text x="56" y="148" class="dark" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="700">① 观察事实</text>
    <circle cx="139" cy="204" r="25" fill="#efc5a4" stroke="#18354c" stroke-width="3"/><path d="M102 240q37-28 74 0v70h-74z" fill="#9b7a9e" stroke="#18354c" stroke-width="3"/><path d="M82 222q-24 18-4 42M195 218q25 17 5 43" class="line"/><text x="56" y="331" class="dark" font-family="Microsoft YaHei, sans-serif" font-size="16">行为 · 持械 · 伤情 · 环境</text>
    <path d="M252 230h34" class="line"/>
    <rect x="292" y="112" width="210" height="238" rx="16" class="card"/><text x="314" y="148" class="dark" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="700">② 降低刺激</text><rect x="318" y="178" width="158" height="112" rx="14" fill="#e2f1ec"/><text x="338" y="215" class="dark" font-family="Microsoft YaHei, sans-serif" font-size="18">疏散围观</text><text x="338" y="248" class="dark" font-family="Microsoft YaHei, sans-serif" font-size="18">建立缓冲</text><text x="338" y="281" class="dark" font-family="Microsoft YaHei, sans-serif" font-size="18">一句一信息点</text><text x="314" y="331" class="dark" font-family="Microsoft YaHei, sans-serif" font-size="16">不争辩、不突然靠近</text>
    <path d="M510 230h34" class="line"/>
    <rect x="550" y="112" width="176" height="238" rx="16" class="card"/><text x="572" y="148" class="dark" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="700">③ 安全分流</text><rect x="570" y="178" width="136" height="58" rx="12" fill="#f8e3df"/><text x="586" y="213" class="dark" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="700">有即时危险</text><rect x="570" y="248" width="136" height="58" rx="12" fill="#e2f1ec"/><text x="586" y="283" class="dark" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="700">无即时危险</text><text x="572" y="331" class="dark" font-family="Microsoft YaHei, sans-serif" font-size="16">持续观察状态</text>
    <rect x="34" y="378" width="332" height="126" rx="16" fill="#f8e3df"/><text x="58" y="416" class="dark" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="700">有即时危险</text><text x="58" y="449" class="dark" font-family="Microsoft YaHei, sans-serif" font-size="17">增援与防护到位 → 必要保护性控制</text><text x="58" y="478" class="dark" font-family="Microsoft YaHei, sans-serif" font-size="17">确保呼吸体位安全，专人持续观察</text>
    <rect x="394" y="378" width="332" height="126" rx="16" fill="#e2f1ec"/><text x="418" y="416" class="dark" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="700">无即时危险</text><text x="418" y="449" class="dark" font-family="Microsoft YaHei, sans-serif" font-size="17">简短安抚 → 询问家属或知情人</text><text x="418" y="478" class="dark" font-family="Microsoft YaHei, sans-serif" font-size="17">为医疗机构依法诊断和接续创造条件</text>
    <rect x="34" y="528" width="692" height="46" rx="12" fill="#163f60"/><text x="58" y="558" class="light" font-family="Microsoft YaHei, sans-serif" font-size="19" font-weight="700">边界：警方评估安全风险；精神障碍诊断、治疗和鉴定由医疗机构负责</text>
  </g>
  <g class="mobile">
    <rect width="760" height="600" rx="24" fill="#f5f9fb"/><rect x="24" y="20" width="712" height="64" rx="14" fill="#315d79"/><text x="48" y="62" class="light" font-family="Microsoft YaHei, sans-serif" font-size="30" font-weight="700">疑似精神障碍｜保护分流</text>
    <rect x="30" y="106" width="700" height="92" rx="16" class="card"/><text x="54" y="145" class="dark" font-family="Microsoft YaHei, sans-serif" font-size="28" font-weight="700">1 只记录行为和环境风险</text><text x="54" y="179" class="dark" font-family="Microsoft YaHei, sans-serif" font-size="25">是否持械、受伤、躁动或处于危险环境</text>
    <rect x="30" y="214" width="700" height="92" rx="16" fill="#e8f1f6"/><text x="54" y="253" class="dark" font-family="Microsoft YaHei, sans-serif" font-size="28" font-weight="700">2 疏散围观，简短安抚</text><text x="54" y="287" class="dark" font-family="Microsoft YaHei, sans-serif" font-size="25">一句一信息点，不争辩，不突然靠近</text>
    <rect x="30" y="322" width="700" height="92" rx="16" fill="#f8e3df"/><text x="54" y="361" class="dark" font-family="Microsoft YaHei, sans-serif" font-size="28" font-weight="700">3 有即时危险 → 保护性控制</text><text x="54" y="395" class="dark" font-family="Microsoft YaHei, sans-serif" font-size="25">防护增援到位，控制后持续观察体位呼吸</text>
    <rect x="30" y="430" width="700" height="92" rx="16" fill="#e2f1ec"/><text x="54" y="469" class="dark" font-family="Microsoft YaHei, sans-serif" font-size="28" font-weight="700">4 无即时危险 → 医疗协同</text><text x="54" y="503" class="dark" font-family="Microsoft YaHei, sans-serif" font-size="25">联系家属或知情人，为专业介入创造条件</text>
    <text x="54" y="560" class="dark" font-family="Microsoft YaHei, sans-serif" font-size="25" font-weight="700">警方不作医学诊断，不使用侮辱性或污名化表述</text>
  </g>
</svg>
