<svg xmlns="http&#58;//www.w3.org/2000/svg" viewBox="0 0 760 600" role="img" aria-labelledby="title desc">
  <title id="title">自伤类警情沟通保护与救助分流图</title>
  <desc id="desc">图中以中性人物和空间分区呈现外围组、主谈人员和当事人的关系，强调倾听理解引导；存在即时生命危险时立即联络急救并团队救助，状态稳定时保持对话并衔接专业支持。</desc>
  <defs><style>.light{fill:#fff}.dark{fill:#18354c}.card{fill:#fff;stroke:#b8cedd;stroke-width:2}.line{fill:none;stroke:#2f7d73;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.desktop{display:block}.mobile{display:none}@media (max-width:500px){.desktop{display:none}.mobile{display:block}}</style></defs>
  <rect width="760" height="600" rx="24" fill="#f5f9fb"/>
  <g class="desktop">
    <rect x="24" y="22" width="712" height="66" rx="14" fill="#315d79"/><text x="48" y="64" class="light" font-family="Microsoft YaHei, sans-serif" font-size="28" font-weight="700">自伤警情｜保护生命的沟通与协同</text>
    <g transform="translate(34 112)"><rect width="692" height="228" rx="18" class="card"/>
      <rect x="22" y="54" width="180" height="142" rx="14" fill="#e8f1f6"/><text x="44" y="86" class="dark" font-family="Microsoft YaHei, sans-serif" font-size="19" font-weight="700">外围组</text><text x="44" y="116" class="dark" font-family="Microsoft YaHei, sans-serif" font-size="16">围挡 · 疏散</text><text x="44" y="143" class="dark" font-family="Microsoft YaHei, sans-serif" font-size="16">联络 120</text><text x="44" y="170" class="dark" font-family="Microsoft YaHei, sans-serif" font-size="16">控制组待命</text>
      <circle cx="312" cy="80" r="22" fill="#efc5a4" stroke="#18354c" stroke-width="3"/><path d="M282 111q30-22 60 0v74h-60z" fill="#2c6e9e" stroke="#18354c" stroke-width="3"/><path d="M344 92q38-30 74-5" class="line"/><text x="252" y="214" class="dark" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="700">主谈：一人说话、降低刺激</text>
      <circle cx="548" cy="82" r="22" fill="#efc5a4" stroke="#18354c" stroke-width="3"/><path d="M516 115q32-23 64 0v48h-64z" fill="#d99b62" stroke="#18354c" stroke-width="3"/><path d="M500 164h98l25 24H475z" fill="#b8cedd"/><text x="472" y="214" class="dark" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="700">当事人：保持观察与安全距离</text>
    </g>
    <rect x="34" y="364" width="214" height="116" rx="14" fill="#e2f1ec"/><text x="54" y="399" class="dark" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="700">倾听</text><text x="54" y="432" class="dark" font-family="Microsoft YaHei, sans-serif" font-size="17">表达关心</text><text x="54" y="458" class="dark" font-family="Microsoft YaHei, sans-serif" font-size="17">不说教、不激将</text>
    <rect x="273" y="364" width="214" height="116" rx="14" fill="#e8f1f6"/><text x="293" y="399" class="dark" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="700">理解</text><text x="293" y="432" class="dark" font-family="Microsoft YaHei, sans-serif" font-size="17">认可感受</text><text x="293" y="458" class="dark" font-family="Microsoft YaHei, sans-serif" font-size="17">不作无法兑现承诺</text>
    <rect x="512" y="364" width="214" height="116" rx="14" fill="#fff0d9"/><text x="532" y="399" class="dark" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="700">引导</text><text x="532" y="432" class="dark" font-family="Microsoft YaHei, sans-serif" font-size="17">提供安全选择</text><text x="532" y="458" class="dark" font-family="Microsoft YaHei, sans-serif" font-size="17">专业支持接续</text>
    <rect x="34" y="504" width="692" height="70" rx="14" fill="#bf4a45"/><text x="58" y="534" class="light" font-family="Microsoft YaHei, sans-serif" font-size="19" font-weight="700">紧急分支：正在造成伤害或出现医疗危象 → 120 已联络，团队立即救助</text><text x="58" y="560" class="light" font-family="Microsoft YaHei, sans-serif" font-size="17">安全控制后检查伤情、持续陪护；不得因判断为“姿态性”而降低风险等级</text>
  </g>
  <g class="mobile">
    <rect width="760" height="600" rx="24" fill="#f5f9fb"/><rect x="24" y="20" width="712" height="64" rx="14" fill="#315d79"/><text x="48" y="62" class="light" font-family="Microsoft YaHei, sans-serif" font-size="30" font-weight="700">自伤警情｜沟通保护</text>
    <rect x="30" y="106" width="700" height="92" rx="16" class="card"/><text x="54" y="145" class="dark" font-family="Microsoft YaHei, sans-serif" font-size="28" font-weight="700">1 先围挡疏散，联络 120</text><text x="54" y="179" class="dark" font-family="Microsoft YaHei, sans-serif" font-size="25">一名主谈，控制组和外围组明确分工</text>
    <rect x="30" y="214" width="700" height="92" rx="16" fill="#e2f1ec"/><text x="54" y="253" class="dark" font-family="Microsoft YaHei, sans-serif" font-size="28" font-weight="700">2 倾听 → 理解 → 引导</text><text x="54" y="287" class="dark" font-family="Microsoft YaHei, sans-serif" font-size="25">不激将、不说教、不作无法兑现承诺</text>
    <rect x="30" y="322" width="700" height="92" rx="16" fill="#f8e3df"/><text x="54" y="361" class="dark" font-family="Microsoft YaHei, sans-serif" font-size="28" font-weight="700">3 即时危险 → 团队立即救助</text><text x="54" y="395" class="dark" font-family="Microsoft YaHei, sans-serif" font-size="25">控制后检查伤情、持续陪护、交接急救</text>
    <rect x="30" y="430" width="700" height="92" rx="16" fill="#e8f1f6"/><text x="54" y="469" class="dark" font-family="Microsoft YaHei, sans-serif" font-size="28" font-weight="700">4 状态稳定 → 保持对话</text><text x="54" y="503" class="dark" font-family="Microsoft YaHei, sans-serif" font-size="25">衔接家属、医疗与后续专业支持</text>
    <text x="54" y="560" class="dark" font-family="Microsoft YaHei, sans-serif" font-size="25" font-weight="700">所有自伤信号都按高风险对待，不作医学诊断</text>
  </g>
</svg>
