<svg xmlns="http&#58;//www.w3.org/2000/svg" viewBox="0 0 760 600" role="img" aria-labelledby="title desc">
  <title id="title">醉酒类警情风险分流与处置交接图</title>
  <desc id="desc">从现场隔离和状态观察开始，区分医疗异常、攻击持械和可以沟通三种情况，分别衔接急救、增援防护或稳定沟通，最后持续观察并记录交接。</desc>
  <defs>
    <style>.light{fill:#fff}.dark{fill:#18354c}.line{fill:none;stroke:#2c6e9e;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.card{fill:#fff;stroke:#b8cedd;stroke-width:2}.desktop{display:block}.mobile{display:none}@media (max-width:500px){.desktop{display:none}.mobile{display:block}}</style>
  </defs>
  <rect width="760" height="600" rx="24" fill="#f4f8fb"/>
  <g class="desktop">
    <rect x="24" y="22" width="712" height="66" rx="14" fill="#163f60"/>
    <text x="48" y="64" class="light" font-family="Microsoft YaHei, sans-serif" font-size="28" font-weight="700">醉酒警情｜先辨状态，再分流处置</text>
    <text x="48" y="118" class="dark" font-family="Microsoft YaHei, sans-serif" font-size="18">疏散围观、隔离危险物；观察意识、呼吸、呕吐、攻击和持械表现</text>
    <g transform="translate(36 148)">
      <rect width="208" height="214" rx="16" class="card"/>
      <circle cx="104" cy="57" r="24" fill="#efc5a4" stroke="#18354c" stroke-width="3"/>
      <path d="M72 91q32-25 64 0l8 68H64z" fill="#d98b2b" stroke="#18354c" stroke-width="3"/>
      <path d="M50 145h108" stroke="#bf4a45" stroke-width="5" stroke-dasharray="12 8"/>
      <text x="26" y="187" class="dark" font-family="Microsoft YaHei, sans-serif" font-size="20" font-weight="700">① 先稳现场</text>
      <text x="26" y="212" class="dark" font-family="Microsoft YaHei, sans-serif" font-size="16">隔离 · 观察 · 双人协同</text>
    </g>
    <path d="M252 255h34" class="line"/>
    <g transform="translate(292 148)">
      <rect width="432" height="214" rx="16" class="card"/>
      <text x="24" y="38" class="dark" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="700">② 按现场表现分流</text>
      <rect x="24" y="56" width="120" height="122" rx="12" fill="#f8e3df"/>
      <text x="38" y="86" class="dark" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="700">医疗异常</text>
      <text x="38" y="114" class="dark" font-family="Microsoft YaHei, sans-serif" font-size="15">意识不清</text><text x="38" y="138" class="dark" font-family="Microsoft YaHei, sans-serif" font-size="15">呼吸异常</text><text x="38" y="162" class="dark" font-family="Microsoft YaHei, sans-serif" font-size="15">→ 120 优先</text>
      <rect x="156" y="56" width="120" height="122" rx="12" fill="#fff0d9"/>
      <text x="170" y="86" class="dark" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="700">攻击持械</text>
      <text x="170" y="114" class="dark" font-family="Microsoft YaHei, sans-serif" font-size="15">请求增援</text><text x="170" y="138" class="dark" font-family="Microsoft YaHei, sans-serif" font-size="15">建立防护</text><text x="170" y="162" class="dark" font-family="Microsoft YaHei, sans-serif" font-size="15">→ 依法控制</text>
      <rect x="288" y="56" width="120" height="122" rx="12" fill="#e2f1ec"/>
      <text x="302" y="86" class="dark" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="700">可以沟通</text>
      <text x="302" y="114" class="dark" font-family="Microsoft YaHei, sans-serif" font-size="15">简短指令</text><text x="302" y="138" class="dark" font-family="Microsoft YaHei, sans-serif" font-size="15">降低刺激</text><text x="302" y="162" class="dark" font-family="Microsoft YaHei, sans-serif" font-size="15">→ 稳定处置</text>
    </g>
    <path d="M380 388v38h-98M508 362v64M636 388v38h-98" class="line"/>
    <rect x="186" y="430" width="388" height="78" rx="16" fill="#2f7d73"/>
    <text x="222" y="465" class="light" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="700">③ 持续观察 → 记录 → 明确交接</text>
    <text x="222" y="493" class="light" font-family="Microsoft YaHei, sans-serif" font-size="16">约束不妨碍呼吸；交接已采取措施和继续关注事项</text>
    <rect x="36" y="530" width="688" height="44" rx="12" fill="#f8e3df"/>
    <text x="58" y="559" class="dark" font-family="Microsoft YaHei, sans-serif" font-size="18" font-weight="700">例外优先：明显医疗风险不等待一般流程；控制后仍须观察呼吸与体位</text>
  </g>
  <g class="mobile">
    <rect width="760" height="600" rx="24" fill="#f4f8fb"/>
    <rect x="24" y="20" width="712" height="64" rx="14" fill="#163f60"/>
    <text x="48" y="62" class="light" font-family="Microsoft YaHei, sans-serif" font-size="30" font-weight="700">醉酒警情｜风险分流</text>
    <rect x="30" y="106" width="700" height="92" rx="16" class="card"/><text x="54" y="145" class="dark" font-family="Microsoft YaHei, sans-serif" font-size="28" font-weight="700">1 先稳现场</text><text x="54" y="179" class="dark" font-family="Microsoft YaHei, sans-serif" font-size="25">隔离围观与危险物，观察意识、呼吸和行为</text>
    <rect x="30" y="214" width="700" height="92" rx="16" fill="#f8e3df"/><text x="54" y="253" class="dark" font-family="Microsoft YaHei, sans-serif" font-size="28" font-weight="700">2 医疗异常 → 120 优先</text><text x="54" y="287" class="dark" font-family="Microsoft YaHei, sans-serif" font-size="25">意识不清、呼吸异常，不等待一般处置流程</text>
    <rect x="30" y="322" width="700" height="92" rx="16" fill="#fff0d9"/><text x="54" y="361" class="dark" font-family="Microsoft YaHei, sans-serif" font-size="28" font-weight="700">3 攻击持械 → 增援防护</text><text x="54" y="395" class="dark" font-family="Microsoft YaHei, sans-serif" font-size="25">保持距离，在人员优势下依法控制</text>
    <rect x="30" y="430" width="700" height="92" rx="16" fill="#e2f1ec"/><text x="54" y="469" class="dark" font-family="Microsoft YaHei, sans-serif" font-size="28" font-weight="700">4 可沟通 → 稳定并交接</text><text x="54" y="503" class="dark" font-family="Microsoft YaHei, sans-serif" font-size="25">简短指令、持续观察、记录措施与去向</text>
    <text x="54" y="560" class="dark" font-family="Microsoft YaHei, sans-serif" font-size="25" font-weight="700">全程底线：不妨碍呼吸，不遗漏观察记录</text>
  </g>
</svg>
