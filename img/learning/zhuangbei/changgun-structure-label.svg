<svg xmlns="http&#58;//www.w3.org/2000/svg" viewBox="0 0 760 440" role="img" aria-labelledby="title desc">
  <title id="title">长警棍结构与双手握持区域</title><desc id="desc">长警棍横向全长结构，标出棍端、整体棍身、防滑握持区和双手位置，并与T字棍轮廓作长度对照。</desc>
  <defs><style>.t{font-family:"Microsoft YaHei","PingFang SC",sans-serif;fill:#18374e}.light{fill:#fff}.dark{fill:#18374e}.h{font-size:26px;font-weight:700}.s{font-size:17px;font-weight:700}.b{font-size:14px}.line{stroke:#28739e;stroke-width:2.5;fill:none}.label{fill:#fff;stroke:#bad0de;stroke-width:1.5}.mobile{display:none}@media (max-width:500px){.mobile{display:block}}</style><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0l8 4-8 4z" fill="#28739e"/></marker></defs>
  <rect width="760" height="440" rx="22" fill="#f5f9fc"/><rect x="24" y="22" width="712" height="58" rx="14" fill="#173f5f"/><text x="48" y="59" class="t h light">长警棍｜整体棍身与双手握持</text>
  <g aria-label="长警棍"><rect x="76" y="199" width="608" height="38" rx="19" fill="#354f5f" stroke="#18374e" stroke-width="4"/><path d="M247 202v32M266 202v32M285 202v32M304 202v32M323 202v32M442 202v32M461 202v32M480 202v32M499 202v32M518 202v32" stroke="#8ba0ac" stroke-width="6"/><path d="M216 165q42-34 84 0l-18 25h-48zM460 165q42-34 84 0l-18 25h-48z" fill="#efc49e" stroke="#18374e" stroke-width="3"/></g>
  <g><rect x="42" y="108" width="130" height="42" rx="10" class="label"/><text x="60" y="135" class="t s">棍端</text><path d="M172 129l-84 63" class="line" marker-end="url(#a)"/><rect x="266" y="108" width="160" height="42" rx="10" class="label"/><text x="284" y="135" class="t s">整体无伸缩机构</text><path d="M346 150v44" class="line" marker-end="url(#a)"/><rect x="548" y="108" width="150" height="42" rx="10" class="label"/><text x="566" y="135" class="t s">另一端</text><path d="M623 150l49 42" class="line" marker-end="url(#a)"/><rect x="216" y="282" width="140" height="42" rx="10" class="label"/><text x="234" y="309" class="t s">防滑握持区</text><path d="M286 282v-40" class="line" marker-end="url(#a)"/><rect x="418" y="282" width="140" height="42" rx="10" class="label"/><text x="436" y="309" class="t s">双手稳固握持</text><path d="M488 282v-40" class="line" marker-end="url(#a)"/></g>
  <rect x="76" y="356" width="608" height="48" rx="12" fill="#e7f2f7"/><text x="98" y="386" class="t s">长棍侧重保持距离；不具备抓捕叉的锁控结构</text>
  <g class="mobile" aria-label="移动端长警棍结构">
    <rect width="760" height="440" rx="22" fill="#f5f9fc"/><rect x="24" y="22" width="712" height="64" rx="14" fill="#173f5f"/><text x="48" y="64" class="t light" font-size="30" font-weight="700">长警棍｜结构</text>
    <rect x="72" y="150" width="616" height="44" rx="22" fill="#354f5f" stroke="#18374e" stroke-width="4"/><path d="M240 152v40M270 152v40M300 152v40M460 152v40M490 152v40M520 152v40" stroke="#8ba0ac" stroke-width="7"/>
    <text x="72" y="242" class="t dark" font-size="27" font-weight="700">棍身整体无伸缩机构</text><text x="72" y="292" class="t dark" font-size="27" font-weight="700">两段防滑区便于双手稳固握持</text><text x="72" y="342" class="t dark" font-size="27" font-weight="700">长棍侧重保持距离</text><text x="72" y="396" class="t dark" font-size="25" font-weight="700">不具备抓捕叉的锁控结构</text>
  </g>
</svg>
