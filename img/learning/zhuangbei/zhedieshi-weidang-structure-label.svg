<svg xmlns="http&#58;//www.w3.org/2000/svg" viewBox="0 0 760 440" role="img" aria-labelledby="title desc">
  <title id="title">折叠式围挡面板与支撑结构</title><desc id="desc">四块硬质面板经铰链串联展开，底部设稳定支架，并示意折叠收纳与多组拼接形成连续遮挡墙。</desc>
  <defs><style>.t{font-family:"Microsoft YaHei","PingFang SC",sans-serif;fill:#18374e}.light{fill:#fff}.dark{fill:#18374e}.h{font-size:26px;font-weight:700}.s{font-size:17px;font-weight:700}.b{font-size:14px}.line{stroke:#28739e;stroke-width:2.5;fill:none}.label{fill:#fff;stroke:#bad0de;stroke-width:1.5}.mobile{display:none}@media (max-width:500px){.mobile{display:block}}</style><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0l8 4-8 4z" fill="#28739e"/></marker></defs>
  <rect width="760" height="440" rx="22" fill="#f5f9fc"/><rect x="24" y="22" width="712" height="58" rx="14" fill="#173f5f"/><text x="48" y="59" class="t h light">折叠式围挡｜连续面板与稳定支架</text>
  <g aria-label="四块展开面板"><g fill="#27536c" stroke="#18374e" stroke-width="4"><rect x="96" y="139" width="128" height="205"/><rect x="224" y="139" width="128" height="205"/><rect x="352" y="139" width="128" height="205"/><rect x="480" y="139" width="128" height="205"/></g><g fill="#e69a3b"><circle cx="224" cy="182" r="7"/><circle cx="224" cy="301" r="7"/><circle cx="352" cy="182" r="7"/><circle cx="352" cy="301" r="7"/><circle cx="480" cy="182" r="7"/><circle cx="480" cy="301" r="7"/></g><text x="256" y="233" class="t s light">警察</text><text x="247" y="260" class="t b light">请勿靠近</text><path d="M120 344l-30 55M200 344l30 55M504 344l-30 55M584 344l30 55" stroke="#536f80" stroke-width="8"/></g>
  <g><rect x="42" y="98" width="130" height="40" rx="9" class="label"/><text x="59" y="124" class="t s">硬质面板</text><path d="M172 118l-38 20" class="line" marker-end="url(#a)"/><rect x="298" y="98" width="130" height="40" rx="9" class="label"/><text x="315" y="124" class="t s">串联铰链</text><path d="M363 138l-11 38" class="line" marker-end="url(#a)"/><rect x="558" y="98" width="150" height="40" rx="9" class="label"/><text x="575" y="124" class="t s">连续拼接</text><path d="M633 138l-35 52" class="line" marker-end="url(#a)"/><rect x="298" y="377" width="150" height="40" rx="9" class="label"/><text x="315" y="403" class="t s">稳定支架</text><path d="M448 397h32" class="line" marker-end="url(#a)"/></g>
  <g class="mobile" aria-label="移动端折叠式围挡结构">
    <rect width="760" height="440" rx="22" fill="#f5f9fc"/><rect x="24" y="22" width="712" height="64" rx="14" fill="#173f5f"/><text x="48" y="64" class="t light" font-size="30" font-weight="700">折叠式围挡｜结构</text>
    <g fill="#27536c" stroke="#18374e" stroke-width="4"><rect x="60" y="128" width="135" height="190"/><rect x="195" y="128" width="135" height="190"/><rect x="330" y="128" width="135" height="190"/></g>
    <text x="510" y="155" class="t dark" font-size="27" font-weight="700">硬质面板</text><text x="510" y="210" class="t dark" font-size="27" font-weight="700">串联铰链</text><text x="510" y="265" class="t dark" font-size="27" font-weight="700">底部支架</text><text x="510" y="320" class="t dark" font-size="27" font-weight="700">连续拼接</text><text x="48" y="397" class="t dark" font-size="25" font-weight="700">多组拼接形成连续遮挡墙</text>
  </g>
</svg>
