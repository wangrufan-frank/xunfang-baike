<svg xmlns="http&#58;//www.w3.org/2000/svg" viewBox="0 0 760 460" role="img" aria-labelledby="title desc">
  <title id="title">阻车钉展开结构与安全控制位置</title>
  <desc id="desc">展开的钉排横置路面，标出钉刺、连接节、拖拽绳、收纳护套和人员应撤至的路侧安全位置。</desc>
  <defs>
    <style>.t{font-family:"Microsoft YaHei","PingFang SC",sans-serif;fill:#17364d}.h{font-size:26px;font-weight:700}.s{font-size:17px;font-weight:700}.b{font-size:14px}.line{stroke:#236b96;stroke-width:2.5;fill:none}.label{fill:#fff;stroke:#b8cedd;stroke-width:1.5}</style>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0l8 4-8 4z" fill="#236b96"/></marker>
  </defs>
  <rect width="760" height="460" rx="22" fill="#f5f9fc"/>
  <rect x="24" y="22" width="712" height="58" rx="14" fill="#173f5f"/>
  <text x="48" y="59" class="t h" fill="#fff">阻车钉｜展开结构与安全控制</text>
  <path d="M42 160H718M42 344H718" stroke="#cedbe3" stroke-width="5" stroke-dasharray="26 18"/>
  <g aria-label="展开的阻车钉钉排">
    <path d="M110 272L545 272" stroke="#273b49" stroke-width="25" stroke-linecap="round"/>
    <g fill="#d7e0e5" stroke="#17364d" stroke-width="2">
      <path d="M132 260l10-70 10 70z"/><path d="M190 260l10-70 10 70z"/><path d="M248 260l10-70 10 70z"/><path d="M306 260l10-70 10 70z"/><path d="M364 260l10-70 10 70z"/><path d="M422 260l10-70 10 70z"/><path d="M480 260l10-70 10 70z"/><path d="M528 260l10-70 10 70z"/>
    </g>
    <g fill="#527084" stroke="#17364d" stroke-width="2"><rect x="146" y="253" width="42" height="38" rx="8"/><rect x="204" y="253" width="42" height="38" rx="8"/><rect x="262" y="253" width="42" height="38" rx="8"/><rect x="320" y="253" width="42" height="38" rx="8"/><rect x="378" y="253" width="42" height="38" rx="8"/><rect x="436" y="253" width="42" height="38" rx="8"/></g>
    <path d="M545 273C610 274 621 327 681 328" stroke="#d18629" stroke-width="6" fill="none"/>
    <rect x="668" y="313" width="48" height="28" rx="12" fill="#d18629" stroke="#17364d" stroke-width="2"/>
  </g>
  <g aria-label="结构标注">
    <rect x="42" y="99" width="132" height="42" rx="10" class="label"/><text x="60" y="126" class="t s">钉刺</text><path d="M174 120h66l18 72" class="line" marker-end="url(#a)"/>
    <rect x="276" y="99" width="132" height="42" rx="10" class="label"/><text x="294" y="126" class="t s">连接节</text><path d="M342 141v106" class="line" marker-end="url(#a)"/>
    <rect x="486" y="99" width="168" height="42" rx="10" class="label"/><text x="504" y="126" class="t s">收拢后装入护套</text><path d="M570 141l-36 108" class="line" marker-end="url(#a)"/>
    <rect x="470" y="368" width="168" height="42" rx="10" class="label"/><text x="488" y="395" class="t s">拖拽绳／手柄</text><path d="M556 368l91-35" class="line" marker-end="url(#a)"/>
  </g>
  <rect x="42" y="368" width="382" height="58" rx="12" fill="#e8f2f7"/>
  <text x="60" y="393" class="t s">布设后撤至路侧安全位置</text><text x="60" y="416" class="t b">不得站在目标车辆行进正面实施拦截</text>
</svg>
