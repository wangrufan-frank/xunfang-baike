<svg xmlns="http&#58;//www.w3.org/2000/svg" viewBox="0 0 760 440" role="img" aria-labelledby="title desc">
  <title id="title">警用约束带类型与闭合结构</title><desc id="desc">并列展示腕部约束带、踝部约束带和约束毯，标出尼龙织带、魔术贴、快拆扣及包裹范围。</desc>
  <defs><style>.t{font-family:"Microsoft YaHei","PingFang SC",sans-serif;fill:#18374e}.h{font-size:26px;font-weight:700}.s{font-size:17px;font-weight:700}.b{font-size:14px}.card{fill:#fff;stroke:#bad0de;stroke-width:1.5}</style></defs>
  <rect width="760" height="440" rx="22" fill="#f5f9fc"/><rect x="24" y="22" width="712" height="58" rx="14" fill="#173f5f"/><text x="48" y="59" class="t h" fill="#fff">警用约束带｜三类形态与闭合件</text>
  <g transform="translate(38 105)" aria-label="腕部约束带"><rect width="210" height="255" rx="16" class="card"/><text x="18" y="34" class="t s">腕部约束带</text><path d="M35 105h140q20 0 20 20v20q0 20-20 20H35z" fill="#315e76" stroke="#18374e" stroke-width="3"/><rect x="73" y="112" width="54" height="46" rx="10" fill="#f1c39e"/><rect x="142" y="115" width="38" height="40" rx="6" fill="#e79538"/><text x="18" y="207" class="t b">尼龙织带＋魔术贴／快拆扣</text><text x="18" y="232" class="t b">用于腕部运动限制</text></g>
  <g transform="translate(275 105)" aria-label="踝部约束带"><rect width="210" height="255" rx="16" class="card"/><text x="18" y="34" class="t s">踝部约束带</text><path d="M35 105h140q20 0 20 20v20q0 20-20 20H35z" fill="#315e76" stroke="#18374e" stroke-width="3"/><rect x="73" y="112" width="54" height="46" rx="10" fill="#f1c39e"/><rect x="142" y="115" width="38" height="40" rx="6" fill="#e79538"/><path d="M49 181h112" stroke="#7f98a7" stroke-width="7" stroke-dasharray="12 8"/><text x="18" y="207" class="t b">柔软、抗拉，闭合可检查</text><text x="18" y="232" class="t b">用于踝部运动限制</text></g>
  <g transform="translate(512 105)" aria-label="约束毯"><rect width="210" height="255" rx="16" class="card"/><text x="18" y="34" class="t s">约束毯</text><path d="M46 76h118v123q-59 34-118 0z" fill="#315e76" stroke="#18374e" stroke-width="3"/><path d="M46 108h118M46 143h118M46 178h118" stroke="#e79538" stroke-width="8"/><circle cx="105" cy="91" r="17" fill="#f1c39e"/><text x="18" y="222" class="t b">宽幅织物包裹躯干与四肢</text><text x="18" y="244" class="t b">限制全身活动</text></g>
  <rect x="38" y="382" width="684" height="38" rx="10" fill="#e7f2f7"/><text x="58" y="407" class="t s">共同要求：快速束缚、安全可控、避免二次伤害</text>
</svg>
