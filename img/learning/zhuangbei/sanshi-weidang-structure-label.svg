<svg xmlns="http&#58;//www.w3.org/2000/svg" viewBox="0 0 760 440" role="img" aria-labelledby="title desc">
  <title id="title">伞式围挡展开结构</title><desc id="desc">绘制伞式围挡正面及背面骨架，标出遮挡面料、伞式骨架、中心伸缩杆、三脚架底座和收拢形态。</desc>
  <defs><style>.t{font-family:"Microsoft YaHei","PingFang SC",sans-serif;fill:#18374e}.light{fill:#fff}.dark{fill:#18374e}.h{font-size:26px;font-weight:700}.s{font-size:17px;font-weight:700}.b{font-size:14px}.line{stroke:#28739e;stroke-width:2.5;fill:none}.label{fill:#fff;stroke:#bad0de;stroke-width:1.5}.mobile{display:none}@media (max-width:500px){.mobile{display:block}}</style><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0l8 4-8 4z" fill="#28739e"/></marker></defs>
  <rect width="760" height="440" rx="22" fill="#f5f9fc"/><rect x="24" y="22" width="712" height="58" rx="14" fill="#173f5f"/><text x="48" y="59" class="t h light">伞式围挡｜快展快收结构</text>
  <g aria-label="展开的伞式围挡"><circle cx="324" cy="233" r="126" fill="#244f68" stroke="#18374e" stroke-width="4"/><circle cx="324" cy="233" r="13" fill="#e69735"/><g stroke="#afc4d0" stroke-width="3"><path d="M324 233L324 107M324 233L413 144M324 233L450 233M324 233L413 322M324 233L235 322M324 233L198 233M324 233L235 144"/></g><text x="277" y="226" class="t s light">现场处置</text><text x="286" y="251" class="t b light">遮挡面料</text><path d="M324 233v144" stroke="#536f80" stroke-width="10"/><path d="M324 377l-61 37M324 377l61 37M324 377v38" stroke="#536f80" stroke-width="8"/></g>
  <g aria-label="收拢形态"><rect x="602" y="151" width="38" height="199" rx="18" fill="#244f68" stroke="#18374e" stroke-width="4"/><path d="M621 350l-38 55M621 350l38 55" stroke="#536f80" stroke-width="7"/><text x="580" y="129" class="t s">收拢成柱状</text></g>
  <g><rect x="42" y="108" width="130" height="42" rx="10" class="label"/><text x="60" y="135" class="t s">遮挡面料</text><path d="M172 129l64 38" class="line" marker-end="url(#a)"/>
    <rect x="42" y="199" width="130" height="42" rx="10" class="label"/><text x="60" y="226" class="t s">伞式骨架</text><path d="M172 220l75 2" class="line" marker-end="url(#a)"/>
    <rect x="448" y="108" width="130" height="42" rx="10" class="label"/><text x="466" y="135" class="t s">中心伸缩杆</text><path d="M513 150l-164 190" class="line" marker-end="url(#a)"/>
    <rect x="448" y="367" width="130" height="42" rx="10" class="label"/><text x="466" y="394" class="t s">三脚架底座</text><path d="M448 388h-57" class="line" marker-end="url(#a)"/></g>
  <g class="mobile" aria-label="移动端伞式围挡结构">
    <rect width="760" height="440" rx="22" fill="#f5f9fc"/><rect x="24" y="22" width="712" height="64" rx="14" fill="#173f5f"/><text x="48" y="64" class="t light" font-size="30" font-weight="700">伞式围挡｜快展快收</text>
    <circle cx="180" cy="236" r="112" fill="#244f68" stroke="#18374e" stroke-width="4"/><path d="M180 236L180 124M180 236L259 157M180 236L292 236M180 236L259 315M180 236L101 315M180 236L68 236M180 236L101 157" stroke="#afc4d0" stroke-width="3"/><text x="335" y="155" class="t dark" font-size="27" font-weight="700">遮挡面料＋伞式骨架</text><text x="335" y="213" class="t dark" font-size="27" font-weight="700">中心伸缩杆＋底座</text><text x="335" y="271" class="t dark" font-size="27" font-weight="700">展开形成圆形遮挡面</text><text x="335" y="329" class="t dark" font-size="27" font-weight="700">收拢后呈柱状</text><text x="48" y="407" class="t dark" font-size="25" font-weight="700">快展快收，便于单人携带和车载</text>
  </g>
</svg>
