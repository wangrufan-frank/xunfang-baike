<svg xmlns="http&#58;//www.w3.org/2000/svg" viewBox="0 0 760 440" role="img" aria-labelledby="title desc">
  <title id="title">防刺服覆盖区域与内部层次</title><desc id="desc">正背面防刺服标出前胸、后背和侧肋覆盖区，剖面显示外层面料与内部防刺层，并强调防刺不防弹。</desc>
  <defs><style>.t{font-family:"Microsoft YaHei","PingFang SC",sans-serif;fill:#18374e}.light{fill:#fff}.dark{fill:#18374e}.h{font-size:26px;font-weight:700}.s{font-size:17px;font-weight:700}.b{font-size:14px}.line{stroke:#28739e;stroke-width:2.5;fill:none}.label{fill:#fff;stroke:#bad0de;stroke-width:1.5}.mobile{display:none}@media (max-width:500px){.mobile{display:block}}</style><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0l8 4-8 4z" fill="#28739e"/></marker></defs>
  <rect width="760" height="440" rx="22" fill="#f5f9fc"/><rect x="24" y="22" width="712" height="58" rx="14" fill="#173f5f"/><text x="48" y="59" class="t h light">防刺服｜覆盖区域与防护层</text>
  <g aria-label="防刺服正背面"><path d="M121 128l75-27 75 27 45 70-38 30-20-29v161H134V199l-20 29-38-30z" fill="#365e74" stroke="#18374e" stroke-width="4"/><rect x="153" y="146" width="86" height="121" rx="14" fill="#dce7ec"/><text x="165" y="202" class="t s">前胸</text><text x="164" y="225" class="t b">防刺层</text><path d="M360 128l75-27 75 27 45 70-38 30-20-29v161H373V199l-20 29-38-30z" fill="#365e74" stroke="#18374e" stroke-width="4"/><rect x="392" y="146" width="86" height="121" rx="14" fill="#dce7ec"/><text x="404" y="202" class="t s">后背</text><text x="403" y="225" class="t b">防刺层</text><path d="M134 214h-18M278 214h18M373 214h-18M497 214h18" stroke="#e59235" stroke-width="12"/></g>
  <g aria-label="材料剖面" transform="translate(575 126)"><rect width="122" height="52" rx="8" fill="#537487"/><rect y="58" width="122" height="52" rx="8" fill="#d2dfe6"/><text x="15" y="32" class="t b light">外层面料</text><text x="15" y="90" class="t b">内部防刺层</text></g>
  <g><rect x="42" y="365" width="130" height="40" rx="9" class="label"/><text x="59" y="391" class="t s">前胸覆盖</text><path d="M172 385l-4-114" class="line" marker-end="url(#a)"/><rect x="303" y="365" width="130" height="40" rx="9" class="label"/><text x="320" y="391" class="t s">侧肋覆盖</text><path d="M368 365l-54-142" class="line" marker-end="url(#a)"/><rect x="474" y="365" width="130" height="40" rx="9" class="label"/><text x="491" y="391" class="t s">后背覆盖</text><path d="M539 365l-74-93" class="line" marker-end="url(#a)"/></g>
  <rect x="575" y="252" width="122" height="83" rx="12" fill="#fbe9dc" stroke="#d97f36" stroke-width="2"/><text x="590" y="282" class="t s">性能边界</text><text x="590" y="310" class="t s">防刺不防弹</text>
  <g class="mobile" aria-label="移动端防刺服覆盖与层次">
    <rect width="760" height="440" rx="22" fill="#f5f9fc"/><rect x="24" y="22" width="712" height="64" rx="14" fill="#173f5f"/><text x="48" y="64" class="t light" font-size="30" font-weight="700">防刺服｜覆盖与层次</text>
    <path d="M80 130l90-30 90 30 42 70-40 28-20-30v166H98V198l-20 30-40-28z" fill="#365e74" stroke="#18374e" stroke-width="4"/><rect x="122" y="150" width="96" height="132" rx="14" fill="#dce7ec"/>
    <text x="345" y="150" class="t dark" font-size="27" font-weight="700">覆盖：前胸、后背、侧肋</text><text x="345" y="207" class="t dark" font-size="27" font-weight="700">外层面料</text><text x="345" y="259" class="t dark" font-size="27" font-weight="700">内部防刺层</text><text x="345" y="326" class="t dark" font-size="30" font-weight="700">性能边界：防刺不防弹</text><text x="48" y="406" class="t dark" font-size="25" font-weight="700">领取和使用时必须辨清防护能力</text>
