<svg xmlns="http&#58;//www.w3.org/2000/svg" viewBox="0 0 760 440" role="img" aria-labelledby="title desc">
  <title id="title">车载5G云台组成结构</title><desc id="desc">警车顶部安装云台摄像机，标出镜头、水平旋转座、俯仰转轴、5G传输模块、供电线和安装支架。</desc>
  <defs><style>.t{font-family:"Microsoft YaHei","PingFang SC",sans-serif;fill:#18374e}.h{font-size:26px;font-weight:700}.s{font-size:17px;font-weight:700}.b{font-size:14px}.line{stroke:#28739e;stroke-width:2.5;fill:none}.label{fill:#fff;stroke:#bad0de;stroke-width:1.5}</style><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0l8 4-8 4z" fill="#28739e"/></marker></defs>
  <rect width="760" height="440" rx="22" fill="#f5f9fc"/><rect x="24" y="22" width="712" height="58" rx="14" fill="#173f5f"/><text x="48" y="59" class="t h" fill="#fff">车载5G云台｜前端感知节点</text>
  <g aria-label="车顶云台摄像机">
    <path d="M214 342h332l-38-84H252z" fill="#dce6eb" stroke="#18374e" stroke-width="4"/><rect x="323" y="225" width="114" height="34" rx="7" fill="#47677a" stroke="#18374e" stroke-width="3"/>
    <ellipse cx="380" cy="211" rx="72" ry="26" fill="#6f8796" stroke="#18374e" stroke-width="3"/><path d="M331 203v-64q0-36 36-36h26q36 0 36 36v64" fill="#eef4f7" stroke="#18374e" stroke-width="4"/>
    <circle cx="380" cy="151" r="43" fill="#253a49" stroke="#18374e" stroke-width="4"/><circle cx="380" cy="151" r="25" fill="#2976a5"/><circle cx="370" cy="141" r="8" fill="#d7f5ff"/>
    <rect x="457" y="275" width="67" height="51" rx="8" fill="#ef9a39" stroke="#18374e" stroke-width="3"/><path d="M474 294h34M474 306h25" stroke="#fff" stroke-width="4"/>
  </g>
  <g><rect x="42" y="105" width="142" height="42" rx="10" class="label"/><text x="60" y="132" class="t s">云台摄像机</text><path d="M184 126h112l39 18" class="line" marker-end="url(#a)"/>
    <rect x="42" y="190" width="142" height="42" rx="10" class="label"/><text x="60" y="217" class="t s">水平旋转座</text><path d="M184 211h120" class="line" marker-end="url(#a)"/>
    <rect x="566" y="105" width="152" height="42" rx="10" class="label"/><text x="584" y="132" class="t s">俯仰转轴</text><path d="M566 126h-98l-42 16" class="line" marker-end="url(#a)"/>
    <rect x="566" y="190" width="152" height="42" rx="10" class="label"/><text x="584" y="217" class="t s">5G传输模块</text><path d="M566 211l-65 63" class="line" marker-end="url(#a)"/>
    <rect x="566" y="275" width="152" height="42" rx="10" class="label"/><text x="584" y="302" class="t s">供电与支架</text><path d="M566 296h-38" class="line" marker-end="url(#a)"/></g>
  <rect x="42" y="370" width="676" height="44" rx="11" fill="#e7f2f7"/><text x="62" y="398" class="t s">现场画面实时回传 → 后方可远程调看并控制镜头指向</text>
