<svg xmlns="http&#58;//www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="title desc">
  <title id="title">小区支点走访｜检查—联巡—闭环</title>
  <desc id="desc">把物业安保支点建成会发现、会报警、能联动的社区前哨。遇案件：位置讲到楼栋门牌，讲清人数行为与逃离方向；先保护现场，不触碰不围观</desc>
