<svg xmlns="http&#58;//www.w3.org/2000/svg" viewBox="0 0 760 520" role="img" aria-labelledby="title desc">
  <title id="title">公共秩序现场分区与记录要素</title>
  <desc id="desc">左侧俯视场景划分沟通区、处置缓冲区和围观引导区，并画出民警、当事人、记录仪和持手机群众；右侧列出记录要素。</desc>
  <defs><style>.t{font-family:"Microsoft YaHei","PingFang SC",sans-serif;fill:#18354c}.h{font-size:26px;font-weight:700}.s{font-size:17px;font-weight:700}.b{font-size:14px}.card{fill:#fff;stroke:#b8cedd;stroke-width:1.5}.ol{stroke:#18354c;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}</style></defs>
  <rect width="760" height="520" rx="24" fill="#f6fafc"/>
  <rect x="24" y="22" width="712" height="58" rx="14" fill="#163f60"/>
  <text x="48" y="59" class="t h" fill="#fff">公共秩序现场｜分区沟通与完整记录</text>
  <text x="48" y="104" class="t b">让沟通、处置、围观各有边界；全景与重点记录相互补充</text>

  <g aria-label="现场分区" transform="translate(28 130)">
    <rect width="456" height="330" rx="18" fill="#e9f2f7" stroke="#b8cedd" stroke-width="2"/>
    <path d="M0 218h456" stroke="#d98b2b" stroke-width="5" stroke-dasharray="14 10"/>
    <rect x="18" y="18" width="190" height="180" rx="14" fill="#dcefeb" stroke="#2f7d73" stroke-width="2"/>
    <text x="34" y="47" class="t s">沟通区</text>
    <circle cx="72" cy="91" r="20" fill="#efc5a4" class="ol"/><path d="M48 120q24-20 48 0v54H48z" fill="#2c6e9e" class="ol"/>
    <circle cx="154" cy="94" r="20" fill="#efc5a4" class="ol"/><path d="M131 123q23-20 46 0v51h-46z" fill="#d98b2b" class="ol"/>
    <path d="M96 95h35" stroke="#2f7d73" stroke-width="3"/><path d="M112 84l14 11-14 11" fill="none" stroke="#2f7d73" stroke-width="3"/>
    <rect x="62" y="124" width="14" height="24" rx="3" fill="#263746" stroke="#fff" stroke-width="1.5"/>

    <rect x="226" y="18" width="212" height="180" rx="14" fill="#f8e8d3" stroke="#d98b2b" stroke-width="2"/>
    <text x="242" y="47" class="t s">处置与记录区</text>
    <circle cx="274" cy="94" r="20" fill="#efc5a4" class="ol"/><path d="M250 123q24-20 48 0v52h-48z" fill="#2c6e9e" class="ol"/>
    <path d="M303 89h58l28 35v42h-86z" fill="#fff" class="ol"/><circle cx="346" cy="119" r="17" fill="#2c6e9e"/><circle cx="346" cy="119" r="8" fill="#dff8ff"/>
    <path d="M286 147h17" stroke="#2c6e9e" stroke-width="4"/>
    <text x="311" y="187" class="t b">全景 → 重点 → 证据</text>

    <text x="18" y="248" class="t s">围观引导区</text>
    <g transform="translate(35 260)"><circle cx="24" cy="16" r="14" fill="#efc5a4" class="ol"/><path d="M6 40q18-15 36 0v30H6z" fill="#708697" class="ol"/><rect x="44" y="12" width="14" height="25" rx="2" fill="#263746"/></g>
    <g transform="translate(143 260)"><circle cx="24" cy="16" r="14" fill="#efc5a4" class="ol"/><path d="M6 40q18-15 36 0v30H6z" fill="#708697" class="ol"/><rect x="44" y="12" width="14" height="25" rx="2" fill="#263746"/></g>
    <g transform="translate(251 260)"><circle cx="24" cy="16" r="14" fill="#efc5a4" class="ol"/><path d="M6 40q18-15 36 0v30H6z" fill="#708697" class="ol"/><rect x="44" y="12" width="14" height="25" rx="2" fill="#263746"/></g>
    <path d="M345 270h72v45h-72" fill="none" stroke="#bf4a45" stroke-width="3"/><text x="356" y="296" class="t b">引导通道</text>
  </g>

  <g aria-label="记录要素" transform="translate(506 130)">
    <rect width="226" height="330" rx="18" class="card"/><text x="22" y="39" class="t s">记录要素</text>
    <g transform="translate(20 60)"><circle cx="17" cy="17" r="17" fill="#2c6e9e"/><text x="12" y="23" class="t s" fill="#fff">1</text><text x="48" y="22" class="t s">时间地点</text><text x="48" y="44" class="t b">到场、结束、移交</text></g>
    <g transform="translate(20 124)"><circle cx="17" cy="17" r="17" fill="#2f7d73"/><text x="12" y="23" class="t s" fill="#fff">2</text><text x="48" y="22" class="t s">人员行为</text><text x="48" y="44" class="t b">身份、诉求、动作</text></g>
    <g transform="translate(20 188)"><circle cx="17" cy="17" r="17" fill="#d98b2b"/><text x="12" y="23" class="t s" fill="#fff">3</text><text x="48" y="22" class="t s">告知措施</text><text x="48" y="44" class="t b">用语、依据、结果</text></g>
    <g transform="translate(20 252)"><circle cx="17" cy="17" r="17" fill="#bf4a45"/><text x="12" y="23" class="t s" fill="#fff">4</text><text x="48" y="22" class="t s">异常上报</text><text x="48" y="44" class="t b">直播、冲突、媒体</text></g>
  </g>
  <rect x="28" y="476" width="704" height="28" rx="8" fill="#e9f2f7"/><text x="48" y="496" class="t b">沟通原则：表明身份 → 倾听核实 → 讲明规则 → 引导分流</text>
</svg>
