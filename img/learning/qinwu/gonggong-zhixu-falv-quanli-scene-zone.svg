    </g>
<g transform="translate(28 246)">
      <rect width="410" height="122" rx="16" fill="#e5f1f3" stroke="#4a879b" stroke-width="2"/>
      <circle cx="36" cy="38" r="22" fill="#1f6584"/><text x="28" y="47" class="light" font-size="28" font-weight="700">3</text>
      <text x="72" y="44" class="dark" font-size="30" font-weight="700">听取核实</text>
      <text x="24" y="92" class="dark" font-size="25">充分听取 · 能核实的当场核实</text>
    </g>
<g transform="translate(460 246)">
      <rect width="410" height="122" rx="16" fill="#f7ead8" stroke="#d7933d" stroke-width="2"/>
      <circle cx="36" cy="38" r="22" fill="#d7933d"/><text x="28" y="47" class="light" font-size="28" font-weight="700">4</text>
      <text x="72" y="44" class="dark" font-size="30" font-weight="700">措施与救济</text>
      <text x="24" y="82" class="dark" font-size="25">必要限度 · 出具</text>
      <text x="24" y="111" class="dark" font-size="25">凭证 · 告知救济</text>
    </g>
    <rect x="28" y="398" width="844" height="112" rx="16" fill="#fff1ed" stroke="#c85b52" stroke-width="2"/>
    <text x="50" y="434" class="dark" font-size="27" font-weight="700">紧急分支</text>
    <text x="50" y="468" class="dark" font-size="25">特殊分支：未成年人通知监护人；伤情健</text>
    <text x="50" y="500" class="dark" font-size="25">康异常立即救助报告；检查扣押依法留痕</text>
    <text x="40" y="548" class="dark" font-size="25" font-weight="700">隐私保护：不在人群中宣读个人信息｜询问尽量移至独立位置</text>
