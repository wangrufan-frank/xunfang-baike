      <text x="18" y="178" class="dark" font-size="22" font-weight="700">表明与说明</text>
      <text x="18" y="210" class="dark" font-size="15">亮明身份</text>
      <text x="18" y="234" class="dark" font-size="15">说明执法事由和依据</text>
    </g><path d="M224 247h20" stroke="#1f6584" stroke-width="4"/><path d="M238 239l9 8-9 8" fill="none" stroke="#1f6584" stroke-width="4"/>
<g transform="translate(244 124)">
      <rect width="196" height="246" rx="18" fill="#f7ead8" stroke="#d7933d" stroke-width="2"/>
      <circle cx="28" cy="28" r="18" fill="#d7933d"/><text x="21" y="36" class="light" font-size="24" font-weight="700">2</text>
      <g transform="translate(43 50)" fill="none" stroke="#1f6584" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10h64l18 18v68H22z" fill="#fff"/><path d="M86 10v20h18M38 48h48M38 66h48M38 84h32"/></g>
      <text x="18" y="178" class="dark" font-size="22" font-weight="700">权利告知</text>
      <text x="18" y="210" class="dark" font-size="15">告知陈述、申辩及应履行义务</text>
      <text x="18" y="234" class="dark" font-size="15"></text>
    </g><path d="M440 247h20" stroke="#1f6584" stroke-width="4"/><path d="M454 239l9 8-9 8" fill="none" stroke="#1f6584" stroke-width="4"/>
<g transform="translate(460 124)">
      <rect width="196" height="246" rx="18" fill="#e5f1f3" stroke="#4a879b" stroke-width="2"/>
      <circle cx="28" cy="28" r="18" fill="#1f6584"/><text x="21" y="36" class="light" font-size="24" font-weight="700">3</text>
      <g transform="translate(43 50)"><circle cx="38" cy="24" r="14" fill="#f1c8a7" stroke="#17324d" stroke-width="3"/><path d="M18 68q20-30 40 0v22H18z" fill="#2f8097" stroke="#17324d" stroke-width="3"/><path d="M76 18q28 0 28 26 0 18-16 22v16H70V64" fill="none" stroke="#1f6584" stroke-width="4"/><path d="M78 36q12 0 12 10" fill="none" stroke="#dc8d32" stroke-width="4"/></g>
