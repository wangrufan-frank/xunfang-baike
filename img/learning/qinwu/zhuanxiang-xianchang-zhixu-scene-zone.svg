      <text x="18" y="178" class="dark" font-size="22" font-weight="700">通行区</text>
      <text x="18" y="210" class="dark" font-size="15">分段放行</text>
      <text x="18" y="234" class="dark" font-size="15">单向流动｜不停留不对冲</text>
    </g><path d="M440 247h20" stroke="#1f6584" stroke-width="4"/><path d="M454 239l9 8-9 8" fill="none" stroke="#1f6584" stroke-width="4"/>
<g transform="translate(460 124)">
