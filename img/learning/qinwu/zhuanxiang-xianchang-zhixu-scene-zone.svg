      <text x="72" y="44" class="dark" font-size="30" font-weight="700">通行区</text>
      <text x="24" y="82" class="dark" font-size="25">分段放行 · 单向流</text>\n      <text x="24" y="111" class="dark" font-size="25">动 · 不停留不对冲</text>
    </g>
<g transform="translate(28 246)">
      <rect width="410" height="122" rx="16" fill="#e5f1f3" stroke="#4a879b" stroke-width="2"/>
      <circle cx="36" cy="38" r="22" fill="#1f6584"/><text x="28" y="47" class="light" font-size="28" font-weight="700">3</text>
      <text x="72" y="44" class="dark" font-size="30" font-weight="700">处置区</text>
      <text x="24" y="82" class="dark" font-size="25">隔开围观 · 留出处</text>\n      <text x="24" y="111" class="dark" font-size="25">置空间 · 分层劝离</text>
    </g>
<g transform="translate(460 246)">
      <rect width="410" height="122" rx="16" fill="#f7ead8" stroke="#d7933d" stroke-width="2"/>
      <circle cx="36" cy="38" r="22" fill="#d7933d"/><text x="28" y="47" class="light" font-size="28" font-weight="700">4</text>
      <text x="72" y="44" class="dark" font-size="30" font-weight="700">服务区</text>
      <text x="24" y="82" class="dark" font-size="25">走失登记 · 伤病先</text>\n      <text x="24" y="111" class="dark" font-size="25">救 · 主动帮扶弱者</text>
    </g>
    <rect x="28" y="398" width="844" height="112" rx="16" fill="#fff1ed" stroke="#c85b52" stroke-width="2"/>
    <text x="50" y="434" class="dark" font-size="27" font-weight="700">紧急分支</text>
    <text x="50" y="468" class="dark" font-size="25">可疑物品：不触碰、疏散周边、报告并守护</text>\n    <text x="50" y="500" class="dark" font-size="25">；极端天气按指令转移，避免遮蔽点拥堵</text>
    <text x="40" y="548" class="dark" font-size="25" font-weight="700">岗位协同：相邻岗可视可联｜引导由志愿者配合｜执法处置由民警实施</text>
