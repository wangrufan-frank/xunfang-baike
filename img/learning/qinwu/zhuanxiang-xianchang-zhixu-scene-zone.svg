    <path d="M50 452l18-34 18 34z" fill="#c85b52"/><text x="62" y="445" class="light" font-size="18" font-weight="700">!</text>
    <text x="102" y="426" class="dark" font-size="18" font-weight="700">异常／紧急分支</text>
    <text x="102" y="455" class="dark" font-size="17">可疑物品：不触碰、疏散周边、报告并守护；极端天气按指令转移，避免遮蔽点拥堵</text>
    <rect x="28" y="494" width="844" height="42" rx="12" fill="#dceeed"/>
    <text x="48" y="522" class="dark" font-size="17" font-weight="700">岗位协同：相邻岗可视可联｜引导由志愿者配合｜执法处置由民警实施</text>
