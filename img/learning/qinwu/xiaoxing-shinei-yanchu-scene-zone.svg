      <text x="24" y="82" class="dark" font-size="25">出口一推即开 · 通道</text>\n      <text x="24" y="111" class="dark" font-size="25">无堆物 · 照明有效</text>
    </g>
<g transform="translate(460 104)">
      <rect width="410" height="122" rx="16" fill="#f7ead8" stroke="#d7933d" stroke-width="2"/>
      <circle cx="36" cy="38" r="22" fill="#d7933d"/><text x="28" y="47" class="light" font-size="28" font-weight="700">2</text>
      <text x="72" y="44" class="dark" font-size="30" font-weight="700">入场控量</text>
      <text x="24" y="82" class="dark" font-size="25">核对容量 · 超</text>\n      <text x="24" y="111" class="dark" font-size="25">员停止放行并通报</text>
    </g>
<g transform="translate(28 246)">
      <rect width="410" height="122" rx="16" fill="#e5f1f3" stroke="#4a879b" stroke-width="2"/>
      <circle cx="36" cy="38" r="22" fill="#1f6584"/><text x="28" y="47" class="light" font-size="28" font-weight="700">3</text>
      <text x="72" y="44" class="dark" font-size="30" font-weight="700">场内处置</text>
      <text x="24" y="82" class="dark" font-size="25">快速进入 · 隔离</text>\n      <text x="24" y="111" class="dark" font-size="25">双方 · 引至场外</text>
    </g>
<g transform="translate(460 246)">
      <rect width="410" height="122" rx="16" fill="#f7ead8" stroke="#d7933d" stroke-width="2"/>
      <circle cx="36" cy="38" r="22" fill="#d7933d"/><text x="28" y="47" class="light" font-size="28" font-weight="700">4</text>
      <text x="72" y="44" class="dark" font-size="30" font-weight="700">散场分向</text>
      <text x="24" y="82" class="dark" font-size="25">出口外侧分流 ·</text>\n      <text x="24" y="111" class="dark" font-size="25"> 关注醉酒与纠纷</text>
    </g>
    <rect x="28" y="398" width="844" height="112" rx="16" fill="#fff1ed" stroke="#c85b52" stroke-width="2"/>
    <text x="50" y="434" class="dark" font-size="27" font-weight="700">紧急分支</text>
    <text x="50" y="468" class="dark" font-size="25">火情或拥挤：第一动作打开全部出口、分</text>\n    <text x="50" y="500" class="dark" font-size="25">向疏散；伤员救助优先于查明原因和取证</text>
    <text x="40" y="548" class="dark" font-size="25" font-weight="700">未闭环隐患：记入台账，明确整改责任与移交部门</text>
