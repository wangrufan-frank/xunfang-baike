<svg xmlns="http&#58;//www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="title desc">
  <title id="title">小型室内演出｜出口优先流程</title>
  <desc id="desc">密闭空间先查出口与容量，场内冲突快速移出，火情拥挤立即疏散。火情或拥挤：第一动作打开全部出口、分向疏散；伤员救助优先于查明原因和取证</desc>
  <defs><style>
    .light{fill:#fff}.dark{fill:#17324d}.desktop{display:block}.mobile{display:none}
    text{font-family:"Microsoft YaHei","PingFang SC",sans-serif}
    @media (max-width:500px){.desktop{display:none}.mobile{display:block}}
  </style></defs>
  <rect width="900" height="560" rx="26" fill="#f5f9fb"/>
  <g class="desktop">
    <rect x="20" y="20" width="860" height="78" rx="18" fill="#164968"/>
    <text x="48" y="57" class="light" font-size="29" font-weight="700">小型室内演出｜出口优先流程</text>
    <text x="48" y="84" class="light" font-size="16">密闭空间先查出口与容量，场内冲突快速移出，火情拥挤立即疏散</text>
    <g transform="translate(28 124)">
      <rect width="196" height="246" rx="18" fill="#e5f1f3" stroke="#4a879b" stroke-width="2"/>
      <circle cx="28" cy="28" r="18" fill="#1f6584"/><text x="21" y="36" class="light" font-size="24" font-weight="700">1</text>
      <g transform="translate(43 50)" fill="none" stroke="#1f6584" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M18 94V12h66v82M48 22v72"/><circle cx="38" cy="54" r="4" fill="#dc8d32"/><path d="M90 54h18M100 44l10 10-10 10"/></g>
      <text x="18" y="178" class="dark" font-size="22" font-weight="700">演前巡查</text>
      <text x="18" y="210" class="dark" font-size="15">出口一推即开</text>
      <text x="18" y="234" class="dark" font-size="15">通道无堆物｜照明有效</text>
    </g><path d="M224 247h20" stroke="#1f6584" stroke-width="4"/><path d="M238 239l9 8-9 8" fill="none" stroke="#1f6584" stroke-width="4"/>
<g transform="translate(244 124)">
      <rect width="196" height="246" rx="18" fill="#f7ead8" stroke="#d7933d" stroke-width="2"/>
      <circle cx="28" cy="28" r="18" fill="#d7933d"/><text x="21" y="36" class="light" font-size="24" font-weight="700">2</text>
      <g transform="translate(43 50)" fill="none" stroke="#1f6584" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><rect x="10" y="18" width="96" height="72" rx="8"/><path d="M30 60h56M58 36v48"/><text x="43" y="53" class="dark" font-size="25" stroke="none">人</text></g>
      <text x="18" y="178" class="dark" font-size="22" font-weight="700">入场控量</text>
      <text x="18" y="210" class="dark" font-size="15">核对容量</text>
      <text x="18" y="234" class="dark" font-size="15">超员停止放行并通报</text>
    </g><path d="M440 247h20" stroke="#1f6584" stroke-width="4"/><path d="M454 239l9 8-9 8" fill="none" stroke="#1f6584" stroke-width="4"/>
<g transform="translate(460 124)">
      <rect width="196" height="246" rx="18" fill="#e5f1f3" stroke="#4a879b" stroke-width="2"/>
      <circle cx="28" cy="28" r="18" fill="#1f6584"/><text x="21" y="36" class="light" font-size="24" font-weight="700">3</text>
      <g transform="translate(43 50)" fill="none" stroke="#1f6584" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M54 10l38 14v28q0 28-38 44Q16 80 16 52V24z" fill="#dceeed"/><path d="M54 30v42M36 51h36"/></g>
      <text x="18" y="178" class="dark" font-size="22" font-weight="700">场内处置</text>
      <text x="18" y="210" class="dark" font-size="15">快速进入</text>
      <text x="18" y="234" class="dark" font-size="15">隔离双方｜引至场外</text>
    </g><path d="M656 247h20" stroke="#1f6584" stroke-width="4"/><path d="M670 239l9 8-9 8" fill="none" stroke="#1f6584" stroke-width="4"/>
<g transform="translate(676 124)">
      <rect width="196" height="246" rx="18" fill="#f7ead8" stroke="#d7933d" stroke-width="2"/>
      <circle cx="28" cy="28" r="18" fill="#d7933d"/><text x="21" y="36" class="light" font-size="24" font-weight="700">4</text>
      <g transform="translate(43 50)" fill="none" stroke="#1f6584" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><rect x="12" y="12" width="58" height="82" rx="4"/><path d="M44 54h54M82 38l16 16-16 16"/><circle cx="34" cy="30" r="8" fill="#dc8d32"/></g>
      <text x="18" y="178" class="dark" font-size="22" font-weight="700">散场分向</text>
      <text x="18" y="210" class="dark" font-size="15">出口外侧分流</text>
      <text x="18" y="234" class="dark" font-size="15">关注醉酒与纠纷</text>
    </g>
    <rect x="28" y="394" width="844" height="82" rx="16" fill="#fff1ed" stroke="#c85b52" stroke-width="2"/>
    <path d="M50 452l18-34 18 34z" fill="#c85b52"/><text x="62" y="445" class="light" font-size="18" font-weight="700">!</text>
    <text x="102" y="426" class="dark" font-size="18" font-weight="700">异常／紧急分支</text>
    <text x="102" y="455" class="dark" font-size="17">火情或拥挤：第一动作打开全部出口、分向疏散；伤员救助优先于查明原因和取证</text>
    <rect x="28" y="494" width="844" height="42" rx="12" fill="#dceeed"/>
    <text x="48" y="522" class="dark" font-size="17" font-weight="700">未闭环隐患：记入台账，明确整改责任与移交部门</text>
  </g>
