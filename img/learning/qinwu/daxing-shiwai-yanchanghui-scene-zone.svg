<svg xmlns="http&#58;//www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="title desc">
  <title id="title">大型室外演唱会｜五区联动</title>
  <desc id="desc">票务、安检、外场、内场到散场，各区发现风险就近降级处置。紧急分支：密度异常、极端天气、火情或伤情——先疏散救助，隔离危险区，同步启动预案</desc>
