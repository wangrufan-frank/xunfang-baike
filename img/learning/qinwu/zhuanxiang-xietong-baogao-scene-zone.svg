    <text x="102" y="455" class="dark" font-size="17">通联中断：换电话、相邻岗位转达或当面报告；危险源先隔离疏散，伤员先救助</text>
    <rect x="28" y="494" width="844" height="42" rx="12" fill="#dceeed"/>
