      <text x="18" y="170" class="dark" font-size="22" font-weight="700">续报准</text>
      <text x="18" y="208" class="dark" font-size="15">人数伤情＋趋势＋措施</text>
      <text x="18" y="232" class="dark" font-size="15">支援需求</text>
    </g><path d="M440 247h20" stroke="#1f6584" stroke-width="4"/><path d="M454 239l9 8-9 8" fill="none" stroke="#1f6584" stroke-width="4"/>
<g transform="translate(460 124)">
      <rect width="196" height="246" rx="18" fill="#e5f1f3" stroke="#4a879b" stroke-width="2"/>
      <circle cx="28" cy="28" r="18" fill="#1f6584"/><text x="21" y="36" class="light" font-size="24" font-weight="700">3</text>
      <g transform="translate(43 50)" fill="none" stroke="#1f6584" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><rect x="10" y="24" width="42" height="58" rx="5" fill="#fff"/><rect x="66" y="24" width="42" height="58" rx="5" fill="#fff"/><path d="M48 53h26M64 43l10 10-10 10"/></g>
      <text x="18" y="170" class="dark" font-size="22" font-weight="700">协同移交</text>
      <text x="18" y="208" class="dark" font-size="15">医疗、消防、交管到场</text>
      <text x="18" y="232" class="dark" font-size="15">人证手续点清</text>
    </g><path d="M656 247h20" stroke="#1f6584" stroke-width="4"/><path d="M670 239l9 8-9 8" fill="none" stroke="#1f6584" stroke-width="4"/>
<g transform="translate(676 124)">
