<svg xmlns="http&#58;//www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="title desc">
  <title id="title">公共秩序事件｜分级降温闭环</title>
  <desc id="desc">先听诉求、再分隔保护；一般人员劝导，违法行为依法处理。升级分支：推搡、打砸、拥挤或伤情——先控险救助、请求增援；人数和情绪变化持续续报</desc>
