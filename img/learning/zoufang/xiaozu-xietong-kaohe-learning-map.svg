<svg xmlns="http&#58;//www.w3.org/2000/svg" viewBox="0 0 760 520" role="img" aria-labelledby="title desc">
  <title id="title">小组协同考核闭环</title>
  <desc id="desc">难度递进、角色协同、群众保护、五维复盘。四个环节为：三级递进、角色协同、群众保护、五维点评。</desc>
  <defs>
