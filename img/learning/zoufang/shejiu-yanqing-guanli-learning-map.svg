<svg xmlns="http&#58;//www.w3.org/2000/svg" viewBox="0 0 760 520" role="img" aria-labelledby="title desc">
  <title id="title">涉酒与宴请四道防线</title>
  <desc id="desc">先识别职务关联，再守住饮酒、驾车与备勤底线。四个环节为：执勤执法、宴请边界、饮酒底线、报告报备。</desc>
  <defs>
    <style>.dark{fill:#18354c}.light{fill:#fff}.title{font:700 27px "Microsoft YaHei","PingFang SC",sans-serif}.sub{font:16px "Microsoft YaHei","PingFang SC",sans-serif}.head{font:700 18px "Microsoft YaHei","PingFang SC",sans-serif}.body{font:15px "Microsoft YaHei","PingFang SC",sans-serif}.card{fill:#fff;stroke:#bdd0dc;stroke-width:1.5}.line{stroke:#2c6e9e;stroke-width:3;fill:none}.desktop{display:block}.mobile{display:none}@media (max-width:500px){.desktop{display:none}.mobile{display:block}}</style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0l8 4-8 4z" fill="#2c6e9e"/></marker>
  </defs>
  <rect width="760" height="520" rx="24" fill="#f4f8fb"/>
  <g class="desktop">
    <rect x="24" y="22" width="712" height="72" rx="16" fill="#163f60"/>
    <text x="48" y="63" class="title light">涉酒与宴请四道防线</text>
    <text x="48" y="84" class="sub light">先识别职务关联，再守住饮酒、驾车与备勤底线</text>
    <path d="M186 244h36M366 244h36M546 244h36" class="line" marker-end="url(#arrow)"/>
    <g transform="translate(36 142)">
      <rect width="146" height="204" rx="18" class="card"/>
      <circle cx="73" cy="46" r="28" fill="#2c6e9e"/>
      <text x="65" y="55" class="light" font-size="26" font-weight="700">1</text>
      <text x="73" y="104" class="head dark" text-anchor="middle">执勤执法</text>
      <path d="M28 124h90" stroke="#d8e4eb" stroke-width="2"/>
      <text x="73" y="157" class="body dark" text-anchor="middle" data-role="body">工作期间禁酒</text>
      <text x="73" y="183" class="body dark" text-anchor="middle" data-role="body">不得酒后上岗</text>
    </g>
    <g transform="translate(216 142)">
      <rect width="146" height="204" rx="18" class="card"/>
      <circle cx="73" cy="46" r="28" fill="#2f7d73"/>
      <text x="65" y="55" class="light" font-size="26" font-weight="700">2</text>
      <text x="73" y="104" class="head dark" text-anchor="middle">宴请边界</text>
      <path d="M28 124h90" stroke="#d8e4eb" stroke-width="2"/>
      <text x="73" y="157" class="body dark" text-anchor="middle" data-role="body">识别职务利害</text>
      <text x="73" y="183" class="body dark" text-anchor="middle" data-role="body">拒绝违规吃请</text>
    </g>
    <g transform="translate(396 142)">
      <rect width="146" height="204" rx="18" class="card"/>
      <circle cx="73" cy="46" r="28" fill="#d98b2b"/>
      <text x="65" y="55" class="dark" font-size="26" font-weight="700">3</text>
      <text x="73" y="104" class="head dark" text-anchor="middle">饮酒底线</text>
      <path d="M28 124h90" stroke="#d8e4eb" stroke-width="2"/>
      <text x="73" y="157" class="body dark" text-anchor="middle" data-role="body">不驾车不携械</text>
      <text x="73" y="183" class="body dark" text-anchor="middle" data-role="body">不参加值班备勤</text>
    </g>
    <g transform="translate(576 142)">
      <rect width="146" height="204" rx="18" class="card"/>
      <circle cx="73" cy="46" r="28" fill="#6a5b8c"/>
      <text x="65" y="55" class="light" font-size="26" font-weight="700">4</text>
      <text x="73" y="104" class="head dark" text-anchor="middle">报告报备</text>
      <path d="M28 124h90" stroke="#d8e4eb" stroke-width="2"/>
      <text x="73" y="157" class="body dark" text-anchor="middle" data-role="body">拿不准先请示</text>
      <text x="73" y="183" class="body dark" text-anchor="middle" data-role="body">按要求如实报备</text>
    </g>
    <rect x="36" y="382" width="688" height="74" rx="16" fill="#e8f1f6" stroke="#bdd0dc"/>
    <circle cx="74" cy="419" r="19" fill="#bf4a45"/>
