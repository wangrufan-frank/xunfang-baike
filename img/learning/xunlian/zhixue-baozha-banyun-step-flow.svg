<svg xmlns="http&#58;//www.w3.org/2000/svg" viewBox="0 0 760 520" role="img" aria-labelledby="title desc">
  <title id="title">现场止血方法逐级选择流程</title>
  <desc id="desc">现场先进行直接压迫和加压包扎，较大动脉出血可指压近心端临时止血，四肢较大动脉出血仍无法控制时使用止血带，并记录时间和持续观察。</desc>
  <defs><style>.t{font-family:"Microsoft YaHei","PingFang SC",sans-serif}.light{fill:#fff}.dark{fill:#18354c}.card{fill:#fff;stroke:#b9cedc;stroke-width:2}.arrow{fill:none;stroke:#2c6e9e;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.desktop{display:block}.mobile{display:none}@media (max-width:500px){.desktop{display:none}.mobile{display:block}}</style></defs>
  <rect width="760" height="520" rx="24" fill="#f6fafc"/>
  <g class="desktop">
    <rect x="24" y="22" width="712" height="66" rx="14" fill="#163f60"/>
    <text x="48" y="64" class="t light" font-size="28" font-weight="700">现场止血｜按伤情逐级选择</text>
    <text x="48" y="118" class="t dark" font-size="18">先控制出血，再包扎固定；全程观察并尽快转交医务人员</text>
    <path d="M233 226h42l-11-11m11 11-11 11M485 226h42l-11-11m11 11-11 11" class="arrow"/>
    <rect x="42" y="158" width="191" height="142" rx="18" class="card"/><circle cx="80" cy="199" r="26" fill="#2c6e9e"/><text x="72" y="208" class="t light" font-size="25" font-weight="700">1</text><text x="119" y="194" class="t dark" font-size="20" font-weight="700">直接压迫</text><text x="119" y="224" class="t dark" font-size="16">覆盖敷料</text><text x="68" y="269" class="t dark" font-size="17">转为加压包扎固定</text>
    <rect x="275" y="158" width="210" height="142" rx="18" class="card"/><circle cx="313" cy="199" r="26" fill="#2f7d73"/><text x="305" y="208" class="t light" font-size="25" font-weight="700">2</text><text x="352" y="194" class="t dark" font-size="20" font-weight="700">较大动脉出血</text><text x="352" y="224" class="t dark" font-size="16">指压近心端</text><text x="301" y="269" class="t dark" font-size="17">作为临时止血措施</text>
    <rect x="527" y="158" width="191" height="142" rx="18" fill="#f8e8d3" stroke="#d98b2b" stroke-width="2"/><circle cx="565" cy="199" r="26" fill="#b94c45"/><text x="557" y="208" class="t light" font-size="25" font-weight="700">3</text><text x="604" y="194" class="t dark" font-size="20" font-weight="700">仍无法控制</text><text x="604" y="224" class="t dark" font-size="16">四肢较大动脉</text><text x="553" y="269" class="t dark" font-size="17">止血带为最终手段</text>
    <rect x="70" y="349" width="620" height="102" rx="16" fill="#eaf4ef"/>
    <text x="98" y="388" class="t dark" font-size="21" font-weight="700">止血带纪律｜靠近出血部位 · 记录上带时间 · 持续观察</text>
    <text x="98" y="422" class="t dark" font-size="17">呼吸心跳停止者应就地先行心肺复苏，不得随意搬动</text>
  </g>
  <g class="mobile">
    <rect x="24" y="22" width="712" height="66" rx="14" fill="#163f60"/>
    <text x="48" y="65" class="t light" font-size="30" font-weight="700">现场止血｜逐级选择</text>
    <g transform="translate(42 112)">
      <rect width="676" height="78" rx="16" class="card"/><circle cx="43" cy="39" r="24" fill="#2c6e9e"/><text x="35" y="48" class="t light" font-size="25" font-weight="700">1</text><text x="86" y="34" class="t dark" font-size="27" font-weight="700">直接压迫 → 加压包扎</text><text x="86" y="66" class="t dark" font-size="25">覆盖敷料并持续施压</text>
      <rect y="94" width="676" height="78" rx="16" class="card"/><circle cx="43" cy="133" r="24" fill="#2f7d73"/><text x="35" y="142" class="t light" font-size="25" font-weight="700">2</text><text x="86" y="128" class="t dark" font-size="27" font-weight="700">较大动脉出血</text><text x="86" y="160" class="t dark" font-size="25">指压近心端临时止血</text>
      <rect y="188" width="676" height="78" rx="16" fill="#f8e8d3" stroke="#d98b2b" stroke-width="2"/><circle cx="43" cy="227" r="24" fill="#b94c45"/><text x="35" y="236" class="t light" font-size="25" font-weight="700">3</text><text x="86" y="222" class="t dark" font-size="27" font-weight="700">四肢大动脉仍无法控制</text><text x="86" y="254" class="t dark" font-size="25">止血带作为最终手段</text>
    </g>
    <rect x="42" y="408" width="676" height="82" rx="15" fill="#eaf4ef"/>
    <text x="66" y="443" class="t dark" font-size="25" font-weight="700">记录时间 · 持续观察 · 尽快转运</text>
    <text x="66" y="476" class="t dark" font-size="25">呼吸心跳停止：就地先做心肺复苏</text>
  </g>
</svg>
