  <g class="mobile">
    <rect x="24" y="22" width="712" height="66" rx="14" fill="#163f60"/>
    <text x="48" y="65" class="t light" font-size="30" font-weight="700">训练—复盘—考评—改进</text>
    <g transform="translate(42 110)">
