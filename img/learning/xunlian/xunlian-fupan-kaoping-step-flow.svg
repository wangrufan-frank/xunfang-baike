      <rect y="78" width="676" height="96" rx="15" fill="#e8f1f6" stroke="#2c6e9e" stroke-width="2"/><circle cx="42" cy="126" r="23" fill="#2f7d73"/><text x="35" y="135" class="t light" font-size="25" font-weight="700">2</text><text x="86" y="115" class="t dark" font-size="27" font-weight="700">五维复盘</text><text x="86" y="151" class="t dark" font-size="25">动作 · 战术 · 沟通 · 时机 · 安全</text>
      <rect y="186" width="676" height="66" rx="15" class="card"/><circle cx="42" cy="219" r="23" fill="#d98b2b"/><text x="35" y="228" class="t light" font-size="25" font-weight="700">3</text><text x="86" y="229" class="t dark" font-size="27" font-weight="700">训练考评｜形成明确结果</text>
      <rect y="264" width="676" height="66" rx="15" fill="#eaf4ef" stroke="#8bb9a7" stroke-width="2"/><circle cx="42" cy="297" r="23" fill="#b94c45"/><text x="35" y="306" class="t light" font-size="25" font-weight="700">4</text><text x="86" y="307" class="t dark" font-size="27" font-weight="700">反馈改进｜进入下一轮训练</text>
